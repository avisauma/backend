<!DOCTYPE html>
<html>
<body style="text-align:center; margin-top:100px; font-family:sans-serif">
  <h1>Frontend is Working! 🚀</h1>
  <button onclick="test()" style="padding:12px 24px; background:#007bff; color:white; border:none; border-radius:8px">Test Backend</button>
  <h2 id="result"></h2>
<script>
async function test(){
  let r = await fetch('http://127.0.0.1:8000/api/hello');
  let d = await r.json();
  document.getElementById('result').innerText = d.message;
}
</script>
</body>
</html>
